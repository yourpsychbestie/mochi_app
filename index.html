<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d3d2d" />
    <meta name="description" content="Mochi, app de bienestar para parejas" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Mochi</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para correr esta app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf("mochi") !== -1 || k.indexOf("workbox") !== -1) {
                caches.delete(k);
              }
            });
          }).catch(function () {});
        }
      })();
    </script>
  </body>
</html>
